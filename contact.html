<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DNDeur Alarm</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/ContactStyle.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=BBH+Sans+Hegarty&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

  <body>
    <nav>
      <div class="navcontainer">
        <div>
          <a href="/" class="image">
            <img src="images/DNDeur.png" alt="THE DOOR" />
          </a>
        </div>

        <div class="nav-links">
          <a href="instructions.html">Instructions</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>
    </nav>

    <div class="header-spacer"></div>

    <!-- Header with a weird HTML Layout, (CSS Grids are used) -->
    <header>
      <!-- Dark header is the top 50% Dark Orange part of the website, needed for css grid -->
      <div class="dark-header"></div>
      <!-- Light header is the bottom 50% White part of the website -->
      <div class="light-header"></div>
      <h1>Contact formulier</h1>
      <form action="">
        <div class="Name">
          <label for="FName">Voornaam</label>
          <input type="text" name="Voornaam" id="FName" class="NameText" />

          <label for="LName">Achernaam</label>
          <input type="text" name="Achternaam" id="LName" class="NameText" />
        </div>
        <div class="ContactInfo">
          <label for="Email">E-mail</label>
          <input type="text" name="E-mail" id="Email" />

          <label for="Onderwerp">Onderwerp</label>
          <input type="text" name="Onderwerp" id="Onderwerp" />

          <label for="text">Text</label>
          <input type="text" name="text" id="text" class="text" />
        </div>
        <button type="submit">Confirm</button>
      </form>
    </header>

    <footer>
      <div class="navcontainer">
        <a href="./contact.html">Contact</a>
        <a href="#">Privacyverklaring</a>
        <a href="#">Algemene voorwaarden</a>
        <a href="#">Cookies</a>
      </div>

      </div>
